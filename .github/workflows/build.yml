name: build
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    # Commits marked [inspect] only look up game internals; they must not publish a release.
    if: "!contains(github.event.head_commit.message, '[inspect]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, for the release changelog
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x ./gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: farexbot-jar
          path: build/libs/farexbot-*.jar
      # Every build becomes its own numbered release (v1.1.<run number>), marked as the latest one.
      # https://github.com/<repo>/releases/latest always opens the newest version.
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/farexbot-*.jar | grep -v -- '-sources' | head -1)
          version=$(basename "$jar" .jar | sed 's/^farexbot-//')
          prev=$(git tag --list 'v*' --sort=-v:refname | head -1)
          {
            echo "**FarexBot $version** for Minecraft 26.3"
            echo
            echo "Requires Fabric Loader 0.19.5+ and Fabric API 0.162.0+26.3. Drop the jar into \`.minecraft/mods\`."
            echo
            echo "### Changes"
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s' "$prev..$GITHUB_SHA"
            else
              git log --no-merges --format='- %s' "$GITHUB_SHA"
            fi
          } > notes.md
          gh release create "v$version" "$jar" --target "$GITHUB_SHA" --title "FarexBot $version" \
            --notes-file notes.md --latest
          # Remove the old rolling "latest" release from before versioned releases.
          gh release delete latest --yes --cleanup-tag || true
