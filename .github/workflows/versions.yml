name: versions
on: [push]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - run: |
          set -e
          mkdir w && cd w
          url=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[] | select(.id=="26.3") | .url')
          curl -s "$(curl -s $url | jq -r .downloads.client.url)" -o client.jar
          curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.162.0+26.3/fabric-api-0.162.0+26.3.jar -o fapi.jar
          mkdir fa && (cd fa && unzip -q ../fapi.jar 'META-INF/jars/*')
          mkdir fcp && for j in fa/META-INF/jars/*.jar; do unzip -qo $j -d fcp '*.class' || true; done
          echo "== fabric client api classes"
          (cd fcp && find net/fabricmc/fabric/api/client -name '*.class' | grep -Ei 'keymap|keybind|command|message|lifecycle' | grep -v '\$' | sort)
          for c in $(cd fcp && find net/fabricmc/fabric/api/client -name '*.class' | grep -Ei 'keymap|keybind|command/v2/Client|message/v1/ClientReceive|ClientTickEvents' | sed 's/\.class$//' | tr / .); do
            echo "== $c"; javap -cp fcp "$c" | grep -v '^Compiled' || true; done
          for c in net.minecraft.client.KeyMapping 'net.minecraft.client.KeyMapping$Category' net.minecraft.client.Minecraft \
            net.minecraft.client.multiplayer.MultiPlayerGameMode net.minecraft.client.multiplayer.ClientPacketListener \
            'net.minecraft.network.protocol.game.ServerboundMovePlayerPacket$Rot' net.minecraft.world.InteractionResult \
            net.minecraft.world.phys.BlockHitResult net.minecraft.network.chat.ClickEvent 'net.minecraft.network.chat.ClickEvent$CopyToClipboard' \
            'net.minecraft.network.chat.HoverEvent$ShowText' net.minecraft.network.chat.Style \
            com.mojang.blaze3d.platform.InputConstants net.minecraft.client.player.LocalPlayer net.minecraft.world.entity.player.Player \
            net.minecraft.world.level.Level net.minecraft.world.entity.Entity net.minecraft.core.BlockPos net.minecraft.world.phys.Vec3; do
            echo "== $c"; javap -cp client.jar "$c" 2>&1 | grep -Ei "class |record |interface |enum | (player|level|gameMode|hitResult)\b|getInstance|KeyMapping\(|Category|consumeClick|useItemOn|sendCommand|sendChat|send\(|Rot\(|consumesAction|BlockHitResult\(|ClickEvent|ShowText|withClickEvent|withHoverEvent|withColor|withUnderlined|EMPTY|Type |KEYSYM|displayClientMessage|blockInteractionRange|getGameProfile|dimension\(\)|getEyePosition\(\)|setYRot|setXRot|horizontalCollision|onGround\(\)|swing\(|getBlockState|toShortString|atCenterOf|distanceToSqr|subtract\(|getName|Identifier|ResourceKey" | head -60 || true
          done
          echo "== net.minecraft.client.KeyMapping full"; javap -cp client.jar net.minecraft.client.KeyMapping | head -60
          echo "== Category full"; javap -cp client.jar 'net.minecraft.client.KeyMapping$Category' || true
          echo "== Profile"; javap -cp client.jar net.minecraft.world.entity.player.Player | grep -i profile
          unzip -l client.jar | grep -E 'com/mojang/authlib|GameProfile' | head -3 || true
