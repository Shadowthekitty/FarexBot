name: versions
on: [push]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25 }
      - run: |
          url=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[] | select(.id=="26.3") | .url')
          curl -s "$(curl -s $url | jq -r .downloads.client.url)" -o client.jar
          j() { echo "== $1"; javap -cp client.jar "$1" | grep -v '^Compiled' ; }
          j net.minecraft.client.gui.screens.Screen
          j net.minecraft.client.gui.components.Button
          j 'net.minecraft.client.gui.components.Button$Builder'
          j net.minecraft.client.gui.components.EditBox | grep -E 'class|EditBox\(|setValue|getValue|setMaxLength|setHint|setResponder|setFilter'
          j net.minecraft.client.gui.components.AbstractWidget | grep -E 'class|active|visible|setMessage|setX|setY|setTooltip|setWidth'
          j net.minecraft.client.gui.GuiGraphicsExtractor | grep -E 'class|String|fill|centered|Centered|text|Text|guiWidth|guiHeight'
          j net.minecraft.client.gui.Gui | grep -E 'class|screen|Screen'
          j net.minecraft.client.Minecraft | grep -E 'setScreen|keyboardHandler|font|Screen'
          j net.minecraft.client.KeyboardHandler | grep -iE 'clipboard'
          j net.minecraft.client.gui.components.Tooltip | grep -E 'create'
          j net.minecraft.client.gui.components.CycleButton | grep -E 'static|class'
          j net.minecraft.client.gui.screens.inventory.BookEditScreen | head -5 || true
          echo "== example screen bytecode: DirectJoinServerScreen"
          javap -p -cp client.jar net.minecraft.client.gui.screens.DirectJoinServerScreen
          javap -c -p -cp client.jar net.minecraft.client.gui.screens.DirectJoinServerScreen | grep -E 'invoke|^  [a-z].*\(' | head -90
