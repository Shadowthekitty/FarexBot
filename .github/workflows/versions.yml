name: versions
on: [push]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25 }
      - run: |
          url=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[] | select(.id=="26.3") | .url')
          curl -s "$(curl -s $url | jq -r .downloads.client.url)" -o client.jar
          echo "== startUseItem"
          javap -c -p -cp client.jar net.minecraft.client.Minecraft | awk '/private void startUseItem\(\)/,/^$/' | grep -E 'invoke|getstatic|iconst|areturn|instanceof' | head -80
          echo "== LivingEntity.swing"
          javap -c -p -cp client.jar net.minecraft.world.entity.LivingEntity | awk '/public boolean swing\(/,/^$/' | grep -E 'invoke|getfield|iload|ifeq|ifne' | head -40
          echo "== LocalPlayer swing"
          javap -c -p -cp client.jar net.minecraft.client.player.LocalPlayer | grep -A30 'swing(' | grep -E 'swing|invoke' | head -20
          echo "== InteractionResult"
          javap -cp client.jar 'net.minecraft.world.InteractionResult$Success' 'net.minecraft.world.InteractionResult$SwingSource'
          echo "== tick end packet"
          javap -c -p -cp client.jar net.minecraft.client.Minecraft | grep -n 'ClientTickEnd'; javap -c -p -cp client.jar net.minecraft.client.multiplayer.ClientPacketListener | grep -n 'ClientTickEnd'
