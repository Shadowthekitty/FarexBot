name: versions
on: [push]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 25 }
      - run: |
          url=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[] | select(.id=="26.3") | .url')
          curl -s "$(curl -s $url | jq -r .downloads.client.url)" -o client.jar
          echo "== Type"; javap -cp client.jar 'com.mojang.blaze3d.platform.InputConstants$Type'
          echo "== InputConstants G"; javap -constants -cp client.jar com.mojang.blaze3d.platform.InputConstants | grep -E 'KEY_G\b|KEY_G |MOUSE_BUTTON_LEFT|static.*Key '
          echo "== swing"; javap -cp client.jar net.minecraft.world.entity.LivingEntity | grep -E 'swing'
          unzip -l client.jar | grep -i 'SwingAnimation' | head
          for c in $(unzip -l client.jar | grep -o 'net/[^ ]*SwingAnimation[^ $]*\.class' | sed 's/\.class//' | tr / . | sort -u); do javap -cp client.jar $c; done
          echo "== Component methods"; for c in net.minecraft.client.player.LocalPlayer net.minecraft.world.entity.player.Player net.minecraft.client.gui.components.ChatComponent; do echo "-- $c"; javap -cp client.jar $c | grep -E 'Component' ; done
          echo "== Minecraft gui"; javap -cp client.jar net.minecraft.client.Minecraft | grep -E ' gui|getChat|Gui '
          echo "== Gui"; javap -cp client.jar net.minecraft.client.gui.Gui | grep -iE 'chat|Message'
